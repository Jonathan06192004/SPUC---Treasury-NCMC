<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings | NCMC Treasury</title>
  <link rel="icon" type="image/png" href="../Assets/logo.png"/>
  <link rel="stylesheet" href="../Styles/Settings.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <script>
    if (!sessionStorage.getItem('ncmc_user')) location.replace('../index.html');
  </script>

  <!-- Decorative blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>

  <header class="settings-header">
    <div class="logo-area">
      <img src="../Assets/logo.png" alt="Logo" class="logo-img"/>
      <div class="org-name">
        <strong>Southwestern Philippines</strong> Union Conference
      </div>
    </div>
    <h1 class="settings-title">SETTINGS</h1>
  </header>

  <main class="settings-main">

    <!-- Left Profile Card -->
    <div class="profile-card">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar" id="profileAvatar">?</div>
      </div>
      <p class="profile-name" id="profileName">—</p>
      <p class="profile-username" id="profileUsername">—</p>

      <div class="profile-stats">
        <div class="stat-row"><span>Mission</span><span>NCMC</span></div>
        <div class="stat-row"><span>Role</span><span>Treasurer</span></div>
        <div class="stat-row"><span>Status</span><span>Active</span></div>
      </div>
    </div>

    <!-- Right Settings Panel -->
    <div class="settings-panel">
      <div class="panel-header">
        <h3>Account Settings</h3>
        <p>Update your personal information and password</p>
      </div>

      <div class="panel-body">
        <div class="form-grid">
          <div class="form-row">
            <label>Username</label>
            <input type="text" id="fUsername" placeholder="username"/>
          </div>
          <div class="form-row">
            <label>Full Name</label>
            <input type="text" id="fFullName" placeholder="Full Name"/>
          </div>
          <div class="form-row">
            <label>Email Address</label>
            <input type="email" id="fEmail" placeholder="email@example.com"/>
          </div>
          <div class="form-row">
            <label>Phone Number</label>
            <input type="text" id="fPhone" placeholder="+63…"/>
          </div>
          <div class="form-divider"></div>
          <div class="form-row form-row-full">
            <label>New Password <span class="pw-hint">(leave blank to keep current)</span></label>
            <input type="password" id="fPassword" placeholder="Enter new password"/>
          </div>
        </div>

        <div class="save-feedback hidden" id="saveFeedback"></div>

        <div class="profile-actions">
          <button class="btn-save-profile" id="btnSave" onclick="saveProfile()">Save Changes</button>
          <button class="btn-logout" onclick="logout()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="bottom-nav-btn" onclick="location.href='Dashboard.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg>
      <span>Home</span>
    </button>
    <button class="bottom-nav-btn active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <script>
    const SUPABASE_URL  = 'https://fczudbtgtpkxteppckwb.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjenVkYnRndHBreHRlcHBja3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NzczMzEsImV4cCI6MjA5MzU1MzMzMX0.AZKGqLFVB-VpBsDrg0ekOzX755t5kLfgWZPEJ92ELeU';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const session = JSON.parse(sessionStorage.getItem('ncmc_user'));

    async function loadProfile() {
      const { data, error } = await sb
        .from('mission_users')
        .select('id, username, full_name, email, phone, mission_id')
        .eq('id', session.id)
        .single();

      if (error || !data) return;

      const initials = (data.full_name || data.username || '?').charAt(0).toUpperCase();
      document.getElementById('profileAvatar').textContent   = initials;
      document.getElementById('profileName').textContent     = data.full_name || '—';
      document.getElementById('profileUsername').textContent = '@' + data.username;

      document.getElementById('fUsername').value = data.username  || '';
      document.getElementById('fFullName').value = data.full_name || '';
      document.getElementById('fEmail').value    = data.email     || '';
      document.getElementById('fPhone').value    = data.phone     || '';
    }

    async function saveProfile() {
      const btn       = document.getElementById('btnSave');
      const username  = document.getElementById('fUsername').value.trim();
      const full_name = document.getElementById('fFullName').value.trim();
      const email     = document.getElementById('fEmail').value.trim();
      const phone     = document.getElementById('fPhone').value.trim();
      const password  = document.getElementById('fPassword').value;

      if (!username) { showFeedback('Username cannot be empty.', 'error'); return; }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      const payload = { username, full_name, email, phone, updated_at: new Date().toISOString() };
      if (password) payload.password_hash = password;

      const { error } = await sb.from('mission_users').update(payload).eq('id', session.id);

      btn.disabled = false;
      btn.textContent = 'Save Changes';

      if (error) { showFeedback(error.message, 'error'); return; }

      const updated = { ...session, username, full_name };
      sessionStorage.setItem('ncmc_user', JSON.stringify(updated));

      document.getElementById('fPassword').value = '';
      document.getElementById('profileName').textContent     = full_name || '—';
      document.getElementById('profileUsername').textContent = '@' + username;
      document.getElementById('profileAvatar').textContent   = (full_name || username).charAt(0).toUpperCase();

      showFeedback('Profile updated successfully!', 'success');
    }

    function showFeedback(msg, type) {
      const el = document.getElementById('saveFeedback');
      el.textContent = msg;
      el.className = 'save-feedback ' + type;
      setTimeout(() => el.classList.add('hidden'), 3500);
    }

    function logout() {
      sessionStorage.removeItem('ncmc_user');
      location.replace('../index.html');
    }

    loadProfile();
  </script>
</body>
</html>
