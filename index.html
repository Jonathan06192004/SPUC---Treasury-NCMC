<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – NCMC Treasury</title>
    <link rel="icon" type="image/png" href="Assets/logo.png"/>
    <link rel="stylesheet" href="Styles/index.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/otpauth@9.3.6/dist/otpauth.umd.min.js"></script>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="login-container">
        <div class="login-logo">
            <img src="Assets/logo.png" alt="NCMC Logo"/>
        </div>
        <h2>NCMC Treasury</h2>
        <p>Sign in with your NCMC credentials</p>


        <form class="login-form" id="loginForm">
            <div class="input-group" id="credentialsGroup">
                <div class="input-wrapper">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="input-wrapper">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
            </div>
            <div class="input-group hidden" id="twoFaGroup">
                <label for="totpCode">Enter 6-Digit Code</label>
                <input type="text" id="totpCode" name="totpCode" maxlength="6" pattern="[0-9]{6}" autocomplete="off" class="code-input">
                <p class="helper-text">Enter the code from your authenticator app</p>
            </div>
            <div class="login-error hidden" id="loginError"></div>
            <button type="submit" class="login-btn" id="loginBtn">Login</button>
            <button type="button" class="login-btn-secondary hidden" id="backBtn" onclick="resetLogin()">Back to Login</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL  = 'https://fczudbtgtpkxteppckwb.supabase.co';
        const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjenVkYnRndHBreHRlcHBja3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NzczMzEsImV4cCI6MjA5MzU1MzMzMX0.AZKGqLFVB-VpBsDrg0ekOzX755t5kLfgWZPEJ92ELeU';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        let tempUser = null;
        let is2FAStep = false;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');

            btn.disabled = true;
            errEl.classList.add('hidden');

            if (!is2FAStep) {
                // Step 1: Verify username and password
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                btn.textContent = 'Signing in...';

                const { data, error } = await sb
                    .from('mission_users')
                    .select('id, username, full_name, mission_id, is_active, two_fa_enabled, totp_secret')
                    .eq('username', username)
                    .eq('password_hash', password)
                    .eq('mission_id', 1)
                    .eq('is_active', true)
                    .maybeSingle();

                if (error || !data) {
                    errEl.textContent = 'Access denied. This portal is for NCMC users only.';
                    errEl.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Login';
                    return;
                }

                if (data.two_fa_enabled) {
                    // Show 2FA input
                    tempUser = data;
                    is2FAStep = true;
                    document.getElementById('credentialsGroup').classList.add('hidden');
                    document.getElementById('twoFaGroup').classList.remove('hidden');
                    document.getElementById('backBtn').classList.remove('hidden');
                    btn.textContent = 'Verify Code';
                    btn.disabled = false;
                    document.getElementById('totpCode').focus();
                } else {
                    sessionStorage.setItem('ncmc_user', JSON.stringify(data));
                    location.href = 'Pages/Dashboard.html';
                }
            } else {
                // Step 2: Verify 2FA code
                const code = document.getElementById('totpCode').value.trim();

                if (code.length !== 6) {
                    errEl.textContent = 'Please enter a 6-digit code.';
                    errEl.classList.remove('hidden');
                    btn.disabled = false;
                    return;
                }

                btn.textContent = 'Verifying...';

                try {
                    const totp = new OTPAuth.TOTP({
                        issuer: 'NCMC Treasury',
                        label: tempUser.username,
                        algorithm: 'SHA1',
                        digits: 6,
                        period: 30,
                        secret: tempUser.totp_secret
                    });

                    const isValid = totp.validate({ token: code, window: 1 }) !== null;

                    if (isValid) {
                        const { totp_secret, ...userData } = tempUser;
                        sessionStorage.setItem('ncmc_user', JSON.stringify(userData));
                        location.href = 'Pages/Dashboard.html';
                    } else {
                        errEl.textContent = 'Invalid code. Please try again.';
                        errEl.classList.remove('hidden');
                        btn.disabled = false;
                        btn.textContent = 'Verify Code';
                        document.getElementById('totpCode').value = '';
                        document.getElementById('totpCode').focus();
                    }
                } catch (err) {
                    errEl.textContent = 'Verification failed. Please try again.';
                    errEl.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Verify Code';
                }
            }
        });

        function resetLogin() {
            is2FAStep = false;
            tempUser = null;
            document.getElementById('credentialsGroup').classList.remove('hidden');
            document.getElementById('twoFaGroup').classList.add('hidden');
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('loginBtn').textContent = 'Login';
            document.getElementById('totpCode').value = '';
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('username').focus();
        }
    </script>
</body>
</html>
